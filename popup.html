<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 250px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 14px;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      .header {
        margin-bottom: 12px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 8px;
      }
      h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: #1e293b;
      }
      .status {
        font-size: 11px;
        color: #10b981;
        font-weight: 600;
        margin-top: 2px;
      }

      .stats-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
        text-align: center;
      }
      .stats-count {
        font-size: 20px;
        font-weight: 800;
        color: #3b82f6;
      }
      .stats-label {
        font-size: 11px;
        color: #64748b;
        margin-top: 2px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background 0.2s;
      }
      .btn-zap {
        background: #ef4444;
        color: white;
      }
      .btn-zap:hover {
        background: #dc2626;
      }

      .btn-list {
        background: #3b82f6;
        color: white;
      }
      .btn-list:hover {
        background: #2563eb;
      }

      .btn-reset {
        background: #e2e8f0;
        color: #334155;
      }
      .btn-reset:hover {
        background: #cbd5e1;
      }
      .btn-reset:disabled,
      .btn-list:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Panel List Elemen */
      .list-container {
        display: none;
        margin-top: 12px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px;
        max-height: 140px;
        overflow-y: auto;
      }
      .list-title {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        margin-bottom: 6px;
      }
      .item-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 6px;
        background: #f1f5f9;
        border-radius: 4px;
        margin-bottom: 4px;
        font-size: 11px;
        font-family: monospace;
        color: #334155;
      }
      .selector-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 160px;
      }
      .btn-del-item {
        background: none;
        border: none;
        color: #ef4444;
        cursor: pointer;
        font-weight: bold;
        padding: 0 4px;
        font-size: 12px;
        width: auto;
      }
      .btn-del-item:hover {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h3>AdClear</h3>
      <div class="status">● Protective Engine Active</div>
    </div>

    <div class="stats-card">
      <div id="zapCount" class="stats-count">0</div>
      <div class="stats-label">Elemen Di-zap pada Situs Ini</div>
    </div>

    <div class="actions">
      <button id="zapBtn" class="btn-zap">⚡ Zap Element</button>
      <button id="toggleListBtn" class="btn-list">📋 Lihat List Elemen</button>
      <button id="resetBtn" class="btn-reset">↩️ Reset Semua Elemen</button>
    </div>

    <!-- Panel List Elemen Tersimpan -->
    <div id="listContainer" class="list-container">
      <div class="list-title">ELEMEN TERKUNCI:</div>
      <ul id="itemList" class="item-list"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
